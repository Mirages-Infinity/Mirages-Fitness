{% extends 'base.html' %}
{% block title %}Iniciar sesión · FitTrack{% endblock %}
{% block content %}
<div class="flex flex-col justify-center min-h-screen px-6 py-12">

  <div class="text-center mb-10">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-lime-400 mb-5 shadow-lg shadow-lime-400/20">
      <span class="text-4xl">🏋️</span>
    </div>
    <h1 class="text-3xl font-black tracking-tight">FitTrack</h1>
    <p class="text-zinc-400 text-sm mt-2">Tu entrenamiento, bajo control.</p>
  </div>

  {% if form.errors %}
    <div class="mb-4 rounded-xl bg-red-500/10 border border-red-500/30 px-4 py-3 text-sm text-red-400">
      Usuario o contraseña incorrectos.
    </div>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Nombre de usuario" required autofocus
           class="w-full rounded-xl bg-zinc-900 border border-zinc-700 px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-lime-400 focus:border-transparent">
    <input type="password" name="password" placeholder="Contraseña" required
           class="w-full rounded-xl bg-zinc-900 border border-zinc-700 px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-lime-400 focus:border-transparent">
    <button type="submit"
            class="w-full rounded-xl bg-lime-400 py-3.5 font-bold text-zinc-950 active:scale-[.98] transition shadow-lg shadow-lime-400/20">
      Entrar
    </button>
  </form>

  <p class="text-center text-sm text-zinc-500 mt-8">
    ¿No tienes cuenta?
    <a href="{% url 'register' %}" class="font-semibold text-lime-400">Regístrate</a>
  </p>
</div>
{% endblock %}
